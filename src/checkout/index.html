
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <!-- EMPTY HEADER PLACEHOLDER -->
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <form id="custInfo">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" required>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" required>
        <label for="street">Street Address:</label>
        <input type="text" id="street" name="street" required>
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required>
        <label for="state">State:</label>
        <input type="text" id="state" name="state" required>
        <label for="zip">Zip Code:</label>
        <input type="number" id="zip" name="zip" required>
        <label for="ccnum">Credit Card Number:</label>
        <input type="number" id="ccnum" name="ccnum" required>
        <label for="expire">Expiration Date:</label>
        <input type="date" id="expire" name="expire" required>
        <label for="scode">Security Code:</label>
        <input type="number" id="scode" name="scode" required>
        <button type="submit">Checkout</button>
      </form>
    </main>

    <!-- EMPTY FOOTER PLACEHOLDER -->
    <footer id="main-footer"></footer>
  </body>
</html>
